<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
<title id="title">Diagrama Entidade-Relacionamento da Livraria</title>
<desc id="desc">Quatro entidades: usuarios, clientes, livros e leituras. Clientes possuem livros; livros possuem leituras.</desc>
